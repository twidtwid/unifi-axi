[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "unifi-axi"
version = "0.1.1"
description = "Agent-ergonomic (AXI) Wi-Fi client and AP diagnosis for UniFi Network: client timelines, drops, on-device verify, firmware kickouts, guarded tx-power changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Todd Dailey" }]
keywords = ["unifi", "ubiquiti", "wifi", "cli", "agent", "axi", "toon"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/twidtwid/unifi-axi"
Issues = "https://github.com/twidtwid/unifi-axi/issues"

[project.scripts]
unifi-axi = "unifi_axi.entry:main"

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_axi"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "E741"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
